version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: darshanai_postgres
    restart: always
    environment:
      POSTGRES_USER: darshan_user
      POSTGRES_PASSWORD: SecureDarshanPassword123!
      POSTGRES_DB: darshanai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darshan_user -d darshanai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & ML Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: darshanai_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://darshan_user:SecureDarshanPassword123!@postgres:5432/darshanai_db
      SECRET_KEY: darshanai_production_jwt_secret_key_change_me_in_real_deployment
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
    ports:
      - "8000:8000"

  # 3. React Frontend with Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: darshanai_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
