databases:
  - name: darshanai-db
    databaseName: darshanai
    user: darshan_admin
    region: oregon
    plan: free

services:
  # FastAPI Backend
  - type: web
    name: darshanai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darshanai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: "*"

  # React Vite Frontend
  - type: web
    runtime: static
    name: darshanai-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://darshanai-backend.onrender.com/api"
      - key: VITE_API_BASE_URL
        value: "https://darshanai-backend.onrender.com/api"
      - key: VITE_WS_URL
        value: "wss://darshanai-backend.onrender.com"
